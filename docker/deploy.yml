version: '3.8'

services:
  sprival:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sprival:latest
    container_name: sprival-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=prod
      # JVM 参数（可选，覆盖 Dockerfile 中的默认值）
      - JAVA_OPTS=-Xms1024m -Xmx2048m -XX:+UseG1GC
      # 时区
      - TZ=Asia/Shanghai
    volumes:
      # 日志目录（可选）
      - ../logs:/app/logs
      # 配置文件（可选，如果需要外部配置）
      # - ../src/main/resources/application.yml:/app/config/application.yml
    networks:
      - sprival-network
    depends_on:
      # 根据实际依赖的服务添加
      # - mysql
      # - redis
      # - kafka
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  sprival-network:
    driver: bridge

volumes:
  sprival-logs:
    driver: local

