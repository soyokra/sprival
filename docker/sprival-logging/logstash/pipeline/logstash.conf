input {
	beats {
		port => 5044
	}

	tcp {
		port => 50000
	}

	# Kafka 输入插件 - 从 Kafka 主题消费日志消息
	kafka {
		bootstrap_servers => "kafka:29092"
		topics => ["application-logs"]
		group_id => "logstash-consumer"
		auto_offset_reset => "earliest"
		codec => "json"
		consumer_threads => 1
		decorate_events => true
	}
}

## Add your filters / logstash plugins configuration here

filter {
	# 处理来自 Kafka 的日志消息
	if [@metadata][kafka][topic] == "application-logs" {
		# 解析时间戳
		if [timestamp] {
			date {
				match => [ "timestamp", "UNIX_MS" ]
				target => "@timestamp"
			}
		}
		
		# 添加索引前缀
		mutate {
			add_field => { "log_source" => "kafka" }
			add_field => { "index_prefix" => "sprival-logs" }
		}
		
		# 处理异常堆栈信息
		if [throwable] {
			mutate {
				add_field => { "has_exception" => "true" }
			}
		}
		
		# 处理 MDC 信息
		if [mdc] {
			ruby {
				code => "
					event.get('mdc').each do |key, value|
						event.set('mdc_' + key, value)
					end
				"
			}
		}
		
		# 处理自定义字段
		if [customFields] {
			ruby {
				code => "
					event.get('customFields').each do |key, value|
						event.set('custom_' + key, value)
					end
				"
			}
		}
	}
}

output {
	if [log_source] == "kafka" {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
			index => "%{index_prefix}-%{+YYYY.MM.dd}"
		}
	} else {
		elasticsearch {
			hosts => "elasticsearch:9200"
			user => "logstash_internal"
			password => "${LOGSTASH_INTERNAL_PASSWORD}"
			index => "logstash-%{+YYYY.MM.dd}"
		}
	}
}
