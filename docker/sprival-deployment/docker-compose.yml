version: '3'

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  registry-data:
    driver: local

services:
  ### registry ###################################################
  registry:
    build:
      context: ./registry
    container_name: sprival-registry
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      # Registry 存储路径
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      # 启用删除功能
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      # 持久化存储
      - registry-data:/var/lib/registry
      # 配置文件（可选）
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
    networks:
      - frontend
      - backend

  ### registry UI ###################################################
  registry-ui:
    image: joxit/docker-registry-ui:2.5.7
    container_name: sprival-registry-ui
    restart: unless-stopped
    ports:
      - "8388:80"
    environment:
      - REGISTRY_URL=http://localhost:5000 # 内部网络使用服务名
    networks:
      - frontend
    depends_on:
      - registry

  ### gitlab ###################################################
  gitlab:
    image: gitlab/gitlab-ee:18.2.7-ee.0
    container_name: gitlab
    restart: always
    hostname: 'localhost.com'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost'
    ports:
      - '8386:80'
      - '4443:443'
      - '222:22'
    volumes:
      - './gitlab/volumes/config:/etc/gitlab'
      - './gitlab/volumes/logs:/var/log/gitlab'
      - './gitlab/volumes/data:/var/opt/gitlab'
    shm_size: '256m'
    networks:
      - frontend