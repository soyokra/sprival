# GitLab CI/CD 配置文件
# 用于 Spring Boot 项目的自动化构建、打包和部署

# 定义全局变量
variables:
  # Maven 配置
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  
  # Docker 配置
  DOCKER_REGISTRY: "docker.io"
  DOCKER_IMAGE_NAME: "soyokra/sprival"
  DOCKER_TAG: "${CI_COMMIT_SHORT_SHA}"
  
  # Java 配置
  JAVA_VERSION: "1.8"

# 定义构建阶段
stages:
  - build
  - test
  - package
  - deploy

# 缓存配置
cache:
  paths:
    - .m2/repository/
  key: "$CI_COMMIT_REF_SLUG"

# 构建阶段：编译项目
build:
  stage: build
  image: maven:3.8-openjdk-8
  script:
    - echo "开始编译项目..."
    - mvn $MAVEN_CLI_OPTS clean compile
    - echo "编译完成"
  only:
    - main
    - develop
    - merge_requests

# 测试阶段：运行单元测试
test:
  stage: test
  image: maven:3.8-openjdk-8
  script:
    - echo "开始运行单元测试..."
    - mvn $MAVEN_CLI_OPTS test
    - echo "测试完成"
  only:
    - main
    - develop
    - merge_requests

# 打包阶段：构建 JAR 包
package:
  stage: package
  image: maven:3.8-openjdk-8
  dependencies:
    - test
  script:
    - echo "开始打包应用..."
    - mvn $MAVEN_CLI_OPTS package
    - echo "打包完成"
    - ls -la target/*.jar
    - echo "产物大小:"
    - du -h target/*.jar || true
    - du -sh target || true
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - main
    - develop
    - tags

# Docker 构建和推送阶段
docker-build:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  dependencies:
    - package
  before_script:
    - echo "准备 Docker 环境..."
    - docker info
    - echo "登录到 Docker Registry..."
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
  script:
    - echo "开始构建 Docker 镜像..."
    - 'echo "镜像标签: $DOCKER_IMAGE_NAME:$DOCKER_TAG"'
    - docker build -t "$DOCKER_IMAGE_NAME:$DOCKER_TAG" .
    - echo "Docker 镜像构建完成"
    - echo "推送镜像到 Registry..."
    - docker push "$DOCKER_IMAGE_NAME:$DOCKER_TAG"
    - echo "镜像推送完成"
    - echo "为主分支打 latest 标签..."
    - docker tag "$DOCKER_IMAGE_NAME:$DOCKER_TAG" "$DOCKER_IMAGE_NAME:latest"
    - docker push "$DOCKER_IMAGE_NAME:latest"
    - echo "latest 标签推送完成"
    - docker rmi "$DOCKER_IMAGE_NAME:$DOCKER_TAG" || true
    - docker rmi "$DOCKER_IMAGE_NAME:latest" || true
  after_script:
    - echo "Docker 构建和推送流程完成"
  only:
    - main
  when: manual
  allow_failure: false

# 生产环境部署（仅限主分支和标签）
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "开始生产环境部署..."
    - 'echo "部署镜像: $DOCKER_IMAGE_NAME:$DOCKER_TAG"'
    - 'echo "部署时间: $(date)"'
    - 'echo "部署分支: $CI_COMMIT_REF_NAME"'
    - 'echo "提交信息: $CI_COMMIT_MESSAGE"'
    # 这里可以添加实际的部署脚本
    # 例如：调用部署 API、更新 Kubernetes 配置等
    - echo "生产环境部署完成"
  only:
    - main
    - tags
  when: manual
  allow_failure: false

# 清理旧镜像（定期任务）
cleanup-old-images:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "清理旧的 Docker 镜像..."
    # 这里可以添加清理脚本
    # 例如：删除超过 30 天的镜像
    - echo "镜像清理完成"
  only:
    - schedules
  when: manual
  allow_failure: true

# 安全扫描（可选）
security-scan:
  stage: test
  image: maven:3.8-openjdk-8
  script:
    - echo "开始安全扫描..."
    - mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:check
    - echo "安全扫描完成"
  artifacts:
    paths:
      - target/dependency-check-report.html
    expire_in: 1 week
  only:
    - main
    - develop
  when: manual
  allow_failure: true