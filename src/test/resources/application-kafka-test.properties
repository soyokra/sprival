# KafkaAppender测试配置

# 启用Kafka日志追加器
sprival.logging.kafka.enabled=true

# Kafka服务器配置
sprival.logging.kafka.bootstrap-servers=localhost:9092
sprival.logging.kafka.topic=test-logs
sprival.logging.kafka.client-id=test-kafka-appender

# 生产者配置
sprival.logging.kafka.acks=1
sprival.logging.kafka.retries=3
sprival.logging.kafka.batch-size=16384
sprival.logging.kafka.linger-ms=1
sprival.logging.kafka.buffer-memory=33554432
sprival.logging.kafka.compression-type=none
sprival.logging.kafka.enable-idempotence=false

# 超时配置
sprival.logging.kafka.request-timeout-ms=30000
sprival.logging.kafka.delivery-timeout-ms=120000
sprival.logging.kafka.max-block-ms=60000

# 日志级别过滤
sprival.logging.kafka.level=INFO

# 是否包含MDC信息
sprival.logging.kafka.include-mdc=true

# 是否包含异常堆栈信息
sprival.logging.kafka.include-stack-trace=true

# 自定义字段
sprival.logging.kafka.custom-fields.environment=test
sprival.logging.kafka.custom-fields.service=sprival
sprival.logging.kafka.custom-fields.version=1.0.0
