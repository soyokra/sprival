# 简化测试配置 - 最小化依赖
spring.application.name = sprival-test
management.endpoints.web.exposure.include = health,info

# 测试服务器配置
server.port = 0
server.servlet.context-path = /api

# 编码配置
server.servlet.encoding.charset = UTF-8
server.servlet.encoding.enabled = true
server.servlet.encoding.force = true

# 禁用所有外部服务
sprival.rabbitmq.enabled = false
sprival.kafka.enabled = false
sprival.mongodb.enabled = false
sprival.elasticsearch.enabled = false
sprival.clickhouse.enabled = false

# 禁用数据库
spring.datasource.dynamic.enabled = false

# 禁用Redis
spring.cache.type = none
spring.redis.enabled = false

# 禁用MongoDB
spring.data.mongodb.uri = 
spring.mongodb.embedded.version = 

# 禁用监控
management.endpoints.enabled-by-default = false
management.endpoint.health.enabled = true
management.endpoint.info.enabled = true

# 日志配置
logging.level.com.soyokra.sprival = DEBUG
logging.level.org.springframework.test = DEBUG
logging.pattern.console = %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
