# 测试环境配置
spring.application.name = sprival-test
management.endpoints.web.exposure.include = health,info,metrics

# 测试服务器配置
server.port = 0
server.servlet.context-path = /api

# 编码配置
server.servlet.encoding.charset = UTF-8
server.servlet.encoding.enabled = true
server.servlet.encoding.force = true

# Jetty测试配置
server.jetty.threads.max = 10
server.jetty.threads.min = 2
server.jetty.threads.idle-timeout = 30s

# 禁用访问日志
server.jetty.accesslog.enabled = false

# 测试数据库配置 - 使用H2内存数据库
spring.datasource.dynamic.p6spy = false
spring.datasource.dynamic.primary = master

# H2主库配置
spring.datasource.dynamic.datasource.master.username = sa
spring.datasource.dynamic.datasource.master.password = 
spring.datasource.dynamic.datasource.master.url = jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.master.driver-class-name = org.h2.Driver
spring.datasource.dynamic.datasource.master.type = com.zaxxer.hikari.HikariDataSource

# H2从库配置
spring.datasource.dynamic.datasource.slave.username = sa
spring.datasource.dynamic.datasource.slave.password = 
spring.datasource.dynamic.datasource.slave.url = jdbc:h2:mem:testdb_slave;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.dynamic.datasource.slave.driver-class-name = org.h2.Driver
spring.datasource.dynamic.datasource.slave.type = com.zaxxer.hikari.HikariDataSource

# HikariCP测试配置 - 简化配置避免H2语法问题
spring.datasource.dynamic.hikari.connection_test_query = SELECT 1
spring.datasource.dynamic.hikari.is-auto-commit = true
spring.datasource.dynamic.hikari.max_pool_size = 5
spring.datasource.dynamic.hikari.min_idle = 1
spring.datasource.dynamic.hikari.max_lifetime = 300000
spring.datasource.dynamic.hikari.idle_timeout = 60000
spring.datasource.dynamic.hikari.connection_timeout = 5000
# 禁用MySQL特定的初始化SQL
spring.datasource.dynamic.hikari.connection-init-sql = 

# 测试Redis配置 - 使用嵌入式Redis
spring.cache.type = redis
spring.redis.host = localhost
spring.redis.port = 6370
spring.redis.database = 15
spring.redis.timeout = 1000ms
spring.redis.connect-timeout = 1000ms

# Lettuce测试配置
spring.redis.lettuce.pool.max-active = 5
spring.redis.lettuce.pool.max-idle = 3
spring.redis.lettuce.pool.min-idle = 1
spring.redis.lettuce.pool.max-wait = 1000ms

# 测试缓存配置
spring.cache.redis.time-to-live = 60000
spring.cache.redis.cache-null-values = false
spring.cache.redis.key-prefix = test:
spring.cache.redis.use-key-prefix = true

# 测试RabbitMQ配置 - 禁用
sprival.rabbitmq.enabled = false

# 测试Kafka配置 - 禁用
sprival.kafka.enabled = false

# 测试MongoDB配置 - 使用嵌入式MongoDB
sprival.mongodb.enabled = true
sprival.mongodb.database = test_sprival
sprival.mongodb.host = localhost
sprival.mongodb.port = 27018
sprival.mongodb.username = 
sprival.mongodb.password = 
sprival.mongodb.authentication-database = admin
sprival.mongodb.connect-timeout-ms = 5000
sprival.mongodb.socket-timeout-ms = 10000
sprival.mongodb.max-pool-size = 5
sprival.mongodb.min-pool-size = 1

# 测试Elasticsearch配置 - 禁用
sprival.elasticsearch.enabled = false

# 测试ClickHouse配置 - 禁用
sprival.clickhouse.enabled = false
spring.datasource.dynamic.datasource.clickhouse.enabled = false

# 测试HTTP客户端配置
sprival.http.client.connect-timeout = 2s
sprival.http.client.read-timeout = 5s
sprival.http.client.write-timeout = 5s
sprival.http.client.max-connections = 10
sprival.http.client.max-idle-connections = 5

# 日志配置
logging.level.com.soyokra.sprival = DEBUG
logging.level.org.springframework.test = DEBUG
logging.level.org.springframework.boot.test = DEBUG
logging.pattern.console = %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 测试数据初始化
spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:test-schema.sql
spring.sql.init.data-locations = classpath:test-data.sql
