spring.application.name = sprival

# ===========================================
# management\u914D\u7F6E
# ===========================================
# health: diskSpace,ping,refreshScope,discoveryComposite,redis,mongo,db,rabbit,elasticsearch
management.endpoints.web.exposure.include = *
management.metrics.export.prometheus.enabled = true
# \u5B58\u6D3B\u63A2\u9488\uFF0CDOWN\u65F6\u5BB9\u5668\u91CD\u542F
management.endpoint.health.group.liveness.include = livenessState, diskSpace
# \u5C31\u7EEA\u63A2\u9488\uFF0CDOWN\u65F6\u5BB9\u5668\u4E0D\u63A5\u53D7\u6D41\u91CF
management.endpoint.health.group.readiness.include = db
# \u544A\u8B66\u63A2\u9488\uFF0CDOWN\u65F6\u544A\u8B66
management.endpoint.health.group.alertness.include = *

# ===========================================
# Http Server\u914D\u7F6E
# ===========================================
server.port = 8338
server.servlet.context-path = /api
# \u7F16\u7801\u914D\u7F6E
server.servlet.encoding.charset = UTF-8
server.servlet.encoding.enabled = true
server.servlet.encoding.force = true
## Jetty\u670D\u52A1\u5668\u914D\u7F6E
server.jetty.threads.max=200
server.jetty.threads.min=20
server.jetty.threads.idle-timeout=60s
server.jetty.connection-idle-timeout=60s
# Jetty\u8BBF\u95EE\u65E5\u5FD7\u914D\u7F6E
server.jetty.accesslog.enabled=true
server.jetty.accesslog.filename=logs/jetty-access.log
server.jetty.accesslog.format=EXTENDED_NCSA
server.jetty.accesslog.retain-days=7
server.jetty.accesslog.ignore-paths=/actuator/health,/actuator/prometheus,/favicon.ico
server.jetty.accesslog.append=true
# HTTP\u4F18\u5316\u914D\u7F6E
server.max-http-header-size=16KB
server.max-http-form-post-size=2MB
server.shutdown=graceful
# \u538B\u7F29\u914D\u7F6E
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/javascript
server.compression.min-response-size=2KB

# ===========================================
# HTTP Client\u914D\u7F6E
# ===========================================
# Feign\u914D\u7F6E
feign.okhttp.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=basic
feign.compression.request.enabled=true
feign.compression.response.enabled=true
feign.micrometer.enabled=true
# \u9488\u5BF9 sprival-service \u7684\u4E13\u7528\u914D\u7F6E
feign.client.config.sprival-service.connect-timeout=2000
feign.client.config.sprival-service.read-timeout=5000
feign.client.config.sprival-service.logger-level=FULL
# OkHttp\u914D\u7F6E
okhttp.connection-pool.max-idle-connections=50
okhttp.connection-pool.keep-alive-duration=300s
okhttp.connect-timeout=10s
okhttp.read-timeout=30s
okhttp.write-timeout=30s
# Resilience4j\u914D\u7F6E
resilience4j.circuitbreaker.instances.feign.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.feign.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.feign.sliding-window-size=10
resilience4j.circuitbreaker.instances.feign.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.feign.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.feign.max-attempts=3
resilience4j.retry.instances.feign.wait-duration=1s

# ===========================================
# mysql \u914D\u7F6E
# ===========================================
# mybatis-plus \u52A8\u6001\u6570\u636E\u6E90
spring.datasource.dynamic.p6spy = true
spring.datasource.dynamic.primary = master
# \u4E3B\u5E93
spring.datasource.dynamic.datasource.master.username = root
spring.datasource.dynamic.datasource.master.password = workdock
spring.datasource.dynamic.datasource.master.url = jdbc:mysql://localhost:33306/blog?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.dynamic.datasource.master.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.master.type = com.zaxxer.hikari.HikariDataSource
# \u4ECE\u5E93
spring.datasource.dynamic.datasource.slave.username = root
spring.datasource.dynamic.datasource.slave.password = workdock
spring.datasource.dynamic.datasource.slave.url = jdbc:mysql://localhost:33306/blog?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.dynamic.datasource.slave.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.slave.type = com.zaxxer.hikari.HikariDataSource

# HikariCP \u8FDE\u63A5\u6C60\u914D\u7F6E\u4F18\u5316
spring.datasource.dynamic.hikari.connectionTestQuery = SELECT 1
spring.datasource.dynamic.hikari.autoCommit = true
spring.datasource.dynamic.hikari.maximumPoolSize = 20
spring.datasource.dynamic.hikari.minimumIdle = 5
spring.datasource.dynamic.hikari.maxLifetime = 600000
spring.datasource.dynamic.hikari.idleTimeout = 300000
spring.datasource.dynamic.hikari.connectionTimeout = 10000
spring.datasource.dynamic.hikari.validationTimeout = 3000
spring.datasource.dynamic.hikari.leakDetectionThreshold = 60000
spring.datasource.dynamic.hikari.connectionInitSql = set session wait_timeout=28800,interactive_timeout=28800;

# ===========================================
# Redis \u914D\u7F6E
# ===========================================
spring.redis.host = localhost
spring.redis.port = 6379
spring.redis.password = workdock
spring.redis.database = 0
spring.redis.timeout = 2000ms
spring.redis.connect-timeout = 2000ms
# Lettuce\u8FDE\u63A5\u6C60\u914D\u7F6E
spring.redis.lettuce.pool.max-active = 20
spring.redis.lettuce.pool.max-idle = 10
spring.redis.lettuce.pool.min-idle = 5
spring.redis.lettuce.pool.max-wait = 2000ms
spring.redis.lettuce.pool.time-between-eviction-runs = 30s
spring.redis.lettuce.shutdown-timeout = 100ms
# Spring Cache\u914D\u7F6E
spring.cache.type = redis
spring.cache.redis.time-to-live = 600000
spring.cache.redis.cache-null-values = false
spring.cache.redis.key-prefix = sprival:
spring.cache.redis.use-key-prefix = true
spring.cache.redis.enable-statistics = true
spring.cache.cache-names = order
# Redisson\u914D\u7F6E
spring.redis.redisson.config.singleServerConfig.address = redis://localhost:6379
spring.redis.redisson.config.singleServerConfig.password = workdock
spring.redis.redisson.config.singleServerConfig.database = 0
spring.redis.redisson.config.singleServerConfig.connectionPoolSize = 20
spring.redis.redisson.config.singleServerConfig.connectionMinimumIdleSize = 5
spring.redis.redisson.config.singleServerConfig.idleConnectionTimeout = 10000
spring.redis.redisson.config.singleServerConfig.connectTimeout = 10000
spring.redis.redisson.config.singleServerConfig.timeout = 3000
spring.redis.redisson.config.singleServerConfig.retryAttempts = 3
spring.redis.redisson.config.singleServerConfig.retryInterval = 1500
spring.redis.redisson.config.singleServerConfig.keepAlive = true
spring.redis.redisson.config.singleServerConfig.tcpKeepAlive = true
spring.redis.redisson.config.threads = 16
spring.redis.redisson.config.nettyThreads = 32
spring.redis.redisson.config.transportMode = NIO

# ===========================================
# RabbitMQ \u914D\u7F6E
# ===========================================
spring.rabbitmq.host = localhost
spring.rabbitmq.port = 5672
spring.rabbitmq.username = guest
spring.rabbitmq.password = guest
spring.rabbitmq.virtual-host = /
# RabbitMQ \u8FDE\u63A5\u6C60\u914D\u7F6E
spring.rabbitmq.cache.connection.mode = connection
spring.rabbitmq.cache.connection.size = 10
spring.rabbitmq.cache.channel.size = 25
spring.rabbitmq.cache.channel.checkout-timeout = 30000
spring.rabbitmq.connection-timeout = 15000
# RabbitMQ \u6D88\u606F\u786E\u8BA4\u914D\u7F6E
spring.rabbitmq.publisher-confirm-type = correlated
spring.rabbitmq.publisher-returns = true
spring.rabbitmq.listener.simple.acknowledge-mode = manual
# RabbitMQ \u91CD\u8BD5\u914D\u7F6E
spring.rabbitmq.listener.simple.retry.enabled = true
spring.rabbitmq.listener.simple.retry.max-attempts = 3
spring.rabbitmq.listener.simple.retry.initial-interval = 1000
spring.rabbitmq.listener.simple.retry.multiplier = 2
spring.rabbitmq.listener.simple.retry.max-interval = 10000

# ===========================================
# \u5E94\u7528Kafka\u914D\u7F6E
# ===========================================
# \u57FA\u7840\u8FDE\u63A5\u914D\u7F6E
spring.kafka.bootstrap-servers = localhost:9092
spring.kafka.client-id = sprival-client
# \u751F\u4EA7\u8005\u914D\u7F6E
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks = all
spring.kafka.producer.retries = 3
spring.kafka.producer.retry-backoff-ms = 100
spring.kafka.producer.batch-size = 16384
spring.kafka.producer.linger-ms = 1
spring.kafka.producer.buffer-memory = 33554432
spring.kafka.producer.compression-type = gzip
spring.kafka.producer.enable-idempotence = true
spring.kafka.producer.transaction-id-prefix = sprival-tx-
# \u6D88\u8D39\u8005\u914D\u7F6E
spring.kafka.consumer.group-id = sprival-group
spring.kafka.consumer.client-id = sprival-consumer
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.consumer.enable-auto-commit = false
spring.kafka.consumer.auto-commit-interval-ms = 1000
spring.kafka.consumer.max-poll-records = 500
spring.kafka.consumer.max-poll-interval-ms = 300000
spring.kafka.consumer.session-timeout-ms = 30000
spring.kafka.consumer.heartbeat-interval-ms = 3000
# \u76D1\u542C\u5668\u914D\u7F6E
spring.kafka.listener.ack-mode = manual_immediate
spring.kafka.listener.ack-count = 10
spring.kafka.listener.ack-time = 1000
spring.kafka.listener.concurrency = 3
spring.kafka.listener.poll-timeout = 3000
spring.kafka.listener.auto-startup = true
spring.kafka.listener.missing-topics-fatal = false
# JSON\u53CD\u5E8F\u5217\u5316\u914D\u7F6E
spring.kafka.consumer.properties.spring.json.trusted.packages = *
spring.kafka.consumer.properties.spring.json.use.type.headers = false
spring.kafka.consumer.properties.spring.json.value.default.type = java.lang.Object

# ===========================================
# MongoDB\u914D\u7F6E
# ===========================================
# \u57FA\u7840\u8FDE\u63A5\u914D\u7F6E
spring.data.mongodb.host = localhost
spring.data.mongodb.port = 27017
spring.data.mongodb.database = sprival
spring.data.mongodb.username = admin
spring.data.mongodb.password = workdock
spring.data.mongodb.authentication-database = admin
spring.data.mongodb.auto-index-creation = true
# UUID\u8868\u793A\u65B9\u5F0F
spring.data.mongodb.uuid-representation = standard
# \u8D85\u65F6\u914D\u7F6E
spring.data.mongodb.socket-timeout = 10000ms
spring.data.mongodb.connect-timeout = 5000ms
spring.data.mongodb.server-selection-timeout = 5000ms

# ===========================================
# ClickHouse\u914D\u7F6E
# ===========================================
# \u57FA\u7840\u8FDE\u63A5\u914D\u7F6E
spring.datasource.dynamic.datasource.clickhouse.username = default
spring.datasource.dynamic.datasource.clickhouse.password =
spring.datasource.dynamic.datasource.clickhouse.url = jdbc:clickhouse://localhost:8123/sprival
spring.datasource.dynamic.datasource.clickhouse.driver-class-name = ru.yandex.clickhouse.ClickHouseDriver
spring.datasource.dynamic.datasource.clickhouse.type = ru.yandex.clickhouse.ClickHouseDataSource

# ===========================================
# Elasticsearch\u914D\u7F6E
# ===========================================
# \u57FA\u7840\u8FDE\u63A5\u914D\u7F6E
spring.elasticsearch.uris = http://localhost:8200
spring.elasticsearch.username =
spring.elasticsearch.password =
# \u8D85\u65F6\u914D\u7F6E
spring.elasticsearch.connection-timeout = 5s
spring.elasticsearch.socket-timeout = 30s

# ===========================================
# logging\u914D\u7F6E
# ===========================================
# \u65E5\u5FD7\u6587\u4EF6\u914D\u7F6E
logging.file.name = logs/application.log
logging.file.path = logs
# \u65E5\u5FD7\u6587\u4EF6\u5927\u5C0F\u9650\u5236\uFF08\u9ED8\u8BA410MB\uFF09
logging.logback.rollingpolicy.max-file-size = 100MB
# \u65E5\u5FD7\u6587\u4EF6\u4FDD\u7559\u5929\u6570
logging.logback.rollingpolicy.max-history = 30
# \u603B\u65E5\u5FD7\u5927\u5C0F\u9650\u5236
logging.logback.rollingpolicy.total-size-cap = 5GB
# \u65E5\u5FD7\u6587\u4EF6\u547D\u540D\u6A21\u5F0F
logging.logback.rollingpolicy.file-name-pattern = logs/application-%d{yyyy-MM-dd}.%i.log
# \u542F\u52A8\u65F6\u6E05\u7406\u65E5\u5FD7
logging.logback.rollingpolicy.clean-history-on-start = false

# \u65E5\u5FD7\u7EA7\u522B\u914D\u7F6E
logging.level.root = INFO
logging.level.com.soyokra.sprival = DEBUG
logging.level.org.springframework = INFO
logging.level.org.springframework.web = DEBUG
logging.level.org.springframework.boot = INFO
logging.level.com.baomidou.mybatisplus = DEBUG
logging.level.com.zaxxer.hikari = INFO
logging.level.org.mongodb.driver = INFO
logging.level.org.elasticsearch.client = INFO
logging.level.org.apache.kafka = WARN
logging.level.io.lettuce.core = INFO

# \u65E5\u5FD7\u8F93\u51FA\u683C\u5F0F
logging.pattern.console = %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %magenta([%thread]) %cyan(%logger{36}) - %msg%n
logging.pattern.file = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ===========================================
# Kafka\u65E5\u5FD7\u914D\u7F6E
# ===========================================
sprival.logging.kafka.bootstrap-servers = localhost:9092
sprival.logging.kafka.topic = application-logs


# ===========================================
# \u57DF\u540D\u914D\u7F6E
# ===========================================
domain.sprival.url=http://127.0.0.1:8338