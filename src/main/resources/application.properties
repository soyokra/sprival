spring.application.name = sprival
management.endpoints.web.exposure.include = *
management.metrics.export.prometheus.enabled = true

# server
server.port = 8338
server.servlet.context-path = /api

# 编码配置
server.servlet.encoding.charset = UTF-8
server.servlet.encoding.enabled = true
server.servlet.encoding.force = true
spring.http.encoding.charset = UTF-8
spring.http.encoding.enabled = true
spring.http.encoding.force = true

## Jetty服务器配置
server.jetty.threads.max=200
server.jetty.threads.min=10
server.jetty.threads.idle-timeout=60s
server.jetty.connection-idle-timeout=60s

# Jetty访问日志配置
server.jetty.accesslog.enabled=true
server.jetty.accesslog.filename=jetty-access.log
server.jetty.accesslog.format=EXTENDED_NCSA
server.jetty.accesslog.retain-days=30
server.jetty.accesslog.ignore-paths=/actuator/health,/favicon.ico

# HTTP优化配置
server.max-http-header-size=16KB
server.max-http-form-post-size=2MB
server.shutdown=graceful

# HTTP/2支持
server.http2.enabled=true

# 压缩配置
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/javascript
server.compression.min-response-size=2KB

# mysql

## mybatis-plus dynamic
spring.datasource.dynamic.p6spy = true
spring.datasource.dynamic.primary = master

spring.datasource.dynamic.datasource.master.username = root
spring.datasource.dynamic.datasource.master.password = workdock
spring.datasource.dynamic.datasource.master.url = jdbc:mysql://localhost:3306/sprival?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.dynamic.datasource.master.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.master.type = com.zaxxer.hikari.HikariDataSource

spring.datasource.dynamic.datasource.slave.username = root
spring.datasource.dynamic.datasource.slave.password = workdock
spring.datasource.dynamic.datasource.slave.url = jdbc:mysql://localhost:3306/sprival?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.dynamic.datasource.slave.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.slave.type = com.zaxxer.hikari.HikariDataSource

# HikariCP 连接池配置优化
spring.datasource.dynamic.hikari.connection_test_query = SELECT 1
spring.datasource.dynamic.hikari.is-auto-commit = true
spring.datasource.dynamic.hikari.max_pool_size = 20
spring.datasource.dynamic.hikari.min_idle = 5
spring.datasource.dynamic.hikari.max_lifetime = 600000
spring.datasource.dynamic.hikari.idle_timeout = 300000
spring.datasource.dynamic.hikari.connection_timeout = 10000
spring.datasource.dynamic.hikari.validation_timeout = 3000
spring.datasource.dynamic.hikari.leak_detection_threshold = 60000
spring.datasource.dynamic.hikari.connection_init_sql = set session wait_timeout=28800,interactive_timeout=28800;


# rabbitmq
spring.rabbitmq.host = localhost
spring.rabbitmq.port = 5672
spring.rabbitmq.username = guest
spring.rabbitmq.password = guest
spring.rabbitmq.virtual-host = /

# RabbitMQ 连接池配置
spring.rabbitmq.cache.connection.mode = connection
spring.rabbitmq.cache.connection.size = 10
spring.rabbitmq.cache.channel.size = 25
spring.rabbitmq.cache.channel.checkout-timeout = 30000
spring.rabbitmq.connection-timeout = 15000

# RabbitMQ 消息确认配置
spring.rabbitmq.publisher-confirm-type = correlated
spring.rabbitmq.publisher-returns = true
spring.rabbitmq.listener.simple.acknowledge-mode = manual

# RabbitMQ 重试配置
spring.rabbitmq.listener.simple.retry.enabled = true
spring.rabbitmq.listener.simple.retry.max-attempts = 3
spring.rabbitmq.listener.simple.retry.initial-interval = 1000
spring.rabbitmq.listener.simple.retry.multiplier = 2
spring.rabbitmq.listener.simple.retry.max-interval = 10000

# Sprival RabbitMQ 增强配置
sprival.rabbitmq.enabled = true

# 连接池配置
sprival.rabbitmq.pool.mode = connection
sprival.rabbitmq.pool.connection-size = 10
sprival.rabbitmq.pool.channel-size = 25
sprival.rabbitmq.pool.checkout-timeout = 30000
sprival.rabbitmq.pool.connection-timeout = 15000
sprival.rabbitmq.pool.heartbeat = 30
sprival.rabbitmq.pool.connection-name = sprival-connection

# 重试配置
sprival.rabbitmq.retry.enabled = true
sprival.rabbitmq.retry.max-attempts = 3
sprival.rabbitmq.retry.initial-interval = 1000
sprival.rabbitmq.retry.multiplier = 2.0
sprival.rabbitmq.retry.max-interval = 10000

# 监控配置
sprival.rabbitmq.monitor.enabled = true
sprival.rabbitmq.monitor.collect-interval = 30
sprival.rabbitmq.monitor.health-check-enabled = true
sprival.rabbitmq.monitor.health-check-interval = 60
sprival.rabbitmq.monitor.health-check-timeout = 5000

# 死信队列配置
sprival.rabbitmq.dead-letter.enabled = true
sprival.rabbitmq.dead-letter.exchange = dlx.exchange
sprival.rabbitmq.dead-letter.queue = dlx.queue
sprival.rabbitmq.dead-letter.routing-key = dlx.routing.key
sprival.rabbitmq.dead-letter.message-ttl = 300000
sprival.rabbitmq.dead-letter.max-length = 10000

# mongo
#spring.data.mongodb.host = localhost
#spring.data.mongodb.port = 27017
#spring.data.mongodb.database = admin
#spring.data.mongodb.username = admin
#spring.data.mongodb.password = workdock
spring.data.mongodb.uri = mongodb://admin:workdock@localhost:27017/admin?maxPoolSize=10&minPoolSize=2

# redis
spring.cache.type = redis
spring.redis.host = localhost
spring.redis.port = 6379
spring.redis.password = workdock
spring.redis.database = 0
spring.redis.timeout = 2000ms
spring.redis.connect-timeout = 2000ms

# Lettuce连接池配置
spring.redis.lettuce.pool.max-active = 20
spring.redis.lettuce.pool.max-idle = 10
spring.redis.lettuce.pool.min-idle = 5
spring.redis.lettuce.pool.max-wait = 2000ms
spring.redis.lettuce.pool.time-between-eviction-runs = 30s
spring.redis.lettuce.shutdown-timeout = 100ms

# Spring Cache配置
spring.cache.redis.time-to-live = 600000
spring.cache.redis.cache-null-values = false
spring.cache.redis.key-prefix = sprival:
spring.cache.redis.use-key-prefix = true
spring.cache.redis.enable-statistics = true
spring.cache.cache-names = user,product,order,session

# Redisson配置
spring.redis.redisson.config = classpath:config/redisson.yml

# HTTP Client配置
# Feign配置
feign.okhttp.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=basic
feign.compression.request.enabled=true
feign.compression.response.enabled=true

# OkHttp配置
okhttp.connection-pool.max-idle-connections=50
okhttp.connection-pool.keep-alive-duration=300s
okhttp.connect-timeout=10s
okhttp.read-timeout=30s
okhttp.write-timeout=30s

# Resilience4j配置
resilience4j.circuitbreaker.instances.feign.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.feign.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.feign.sliding-window-size=10
resilience4j.circuitbreaker.instances.feign.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.feign.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.feign.max-attempts=3
resilience4j.retry.instances.feign.wait-duration=1s
resilience4j.retry.instances.feign.retry-exceptions=java.net.ConnectException,java.net.SocketTimeoutException,java.io.IOException

# Spring Cloud LoadBalancer配置
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=35s
spring.cloud.loadbalancer.cache.capacity=256

# Micrometer监控配置
feign.micrometer.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,retries

# Sprival HTTP Client配置
sprival.http.client.connect-timeout=5s
sprival.http.client.read-timeout=10s
sprival.http.client.write-timeout=10s
sprival.http.client.max-connections=200
sprival.http.client.max-idle-connections=50
sprival.http.client.keep-alive-duration=5m

# 用户服务配置
sprival.http.client.user-service.url=http://localhost:8081

# kafka
spring.kafka.bootstrap-servers = localhost:9092





