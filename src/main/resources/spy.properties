# ================================================================
# P6Spy \u914D\u7F6E\u6587\u4EF6
# \u7528\u4E8E\u76D1\u63A7\u548C\u8BB0\u5F55\u6570\u636E\u5E93 SQL \u6267\u884C\u65E5\u5FD7
# ================================================================

# ----------------------------------------------------------------
# \u6A21\u5757\u914D\u7F6E
# ----------------------------------------------------------------
# \u6307\u5B9A\u5E94\u7528\u7684\u6A21\u5757\u5217\u8868\uFF0C\u591A\u4E2A\u6A21\u5757\u7528\u9017\u53F7\u5206\u9694
modulelist=com.p6spy.engine.logging.P6LogFactory,com.p6spy.engine.outage.P6OutageFactory

# ----------------------------------------------------------------
# \u65E5\u5FD7\u8F93\u51FA\u914D\u7F6E
# ----------------------------------------------------------------
# \u65E5\u5FD7\u8BB0\u5F55\u5668\u540D\u79F0\uFF0C\u9ED8\u8BA4\u4F7F\u7528 slf4j
# \u53EF\u9009\u503C: slf4j, sysout, file, custom
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# \u65E5\u5FD7\u6587\u4EF6\u8DEF\u5F84\uFF08\u5F53 appender \u4E3A file \u65F6\u4F7F\u7528\uFF09
#logfile=logs/spy.log

# \u81EA\u5B9A\u4E49\u65E5\u5FD7\u683C\u5F0F\u7C7B
#logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat

# \u5355\u884C\u65E5\u5FD7\u683C\u5F0F\uFF08\u5F53\u4F7F\u7528 SingleLineFormat \u65F6\uFF09
# \u53EF\u7528\u53D8\u91CF: 
#   %(currentTime) - \u5F53\u524D\u65F6\u95F4
#   %(executionTime) - \u6267\u884C\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09
#   %(category) - \u65E5\u5FD7\u7C7B\u522B
#   %(connectionId) - \u8FDE\u63A5ID
#   %(sqlSingleLine) - SQL\u8BED\u53E5\uFF08\u5355\u884C\uFF09
#   %(sql) - SQL\u8BED\u53E5\uFF08\u591A\u884C\uFF09
logMessageFormat=com.p6spy.engine.spy.appender.SingleLineFormat
customLogMessageFormat=%(currentTime) | \u8017\u65F6: %(executionTime)ms | \u8FDE\u63A5ID: %(connectionId) | \u6267\u884C\u8BED\u53E5: %(sql)

# ----------------------------------------------------------------
# \u6570\u636E\u6E90\u914D\u7F6E
# ----------------------------------------------------------------
# \u771F\u5B9E\u6570\u636E\u6E90\u7C7B\u540D\uFF08\u4F7F\u7528 JNDI \u65F6\u914D\u7F6E\uFF09
#realdatasource=/RealMySqlDS
# \u771F\u5B9E\u6570\u636E\u6E90\u5C5E\u6027
#realdatasourceclass=com.mysql.cj.jdbc.Driver
# \u771F\u5B9E\u9A71\u52A8
#realdatasourceproperties=user;password

# JNDI \u6570\u636E\u6E90\u914D\u7F6E
#jndicontextfactory=org.jnp.interfaces.NamingContextFactory
#jndicontextproviderurl=localhost:1099
#jndicontextcustom=java.naming.factory.url.pkgs;org.jboss.naming:org.jnp.interfaces

# ----------------------------------------------------------------
# \u65E5\u5FD7\u8FC7\u6EE4\u914D\u7F6E
# ----------------------------------------------------------------
# \u4F7F\u7528\u6B63\u5219\u8868\u8FBE\u5F0F\u8FC7\u6EE4\u65E5\u5FD7\uFF0C\u4E0D\u8BB0\u5F55\u5339\u914D\u7684 SQL
# \u4F8B\u5982\uFF1A\u8FC7\u6EE4\u67E5\u8BE2\u5E8F\u5217\u7684 SQL
#filter=false
# \u6392\u9664\u7684\u5206\u7C7B\uFF08categories\uFF09\uFF0C\u591A\u4E2A\u7528\u9017\u53F7\u5206\u9694
# \u53EF\u9009\u503C: error, info, batch, debug, statement, commit, rollback, result, resultset
excludecategories=info,debug,result,resultset,batch

# \u5305\u542B\u7684\u5206\u7C7B\uFF08\u53EA\u8BB0\u5F55\u8FD9\u4E9B\u5206\u7C7B\uFF09
#includecategories=

# SQL \u8868\u8FBE\u5F0F\u8FC7\u6EE4\uFF08\u6B63\u5219\u8868\u8FBE\u5F0F\uFF09
# \u4F8B\u5982\uFF1A\u53EA\u8BB0\u5F55\u5305\u542B\u7279\u5B9A\u8868\u540D\u7684 SQL
#sqlexpression=.*users.*

# ----------------------------------------------------------------
# \u6027\u80FD\u76D1\u63A7\u914D\u7F6E
# ----------------------------------------------------------------
# SQL \u6267\u884C\u8D85\u65F6\u65F6\u95F4\uFF08\u79D2\uFF09\uFF0C\u8D85\u8FC7\u6B64\u65F6\u95F4\u7684 SQL \u4F1A\u88AB\u8BB0\u5F55
# 0 \u6216\u8D1F\u6570\u8868\u793A\u4E0D\u9650\u5236
outagedetection=true
outagedetectioninterval=2

# ----------------------------------------------------------------
# \u5F00\u5173\u914D\u7F6E
# ----------------------------------------------------------------
# \u662F\u5426\u81EA\u52A8\u5237\u65B0\u914D\u7F6E
# true: \u81EA\u52A8\u68C0\u6D4B\u914D\u7F6E\u6587\u4EF6\u53D8\u5316\u5E76\u91CD\u65B0\u52A0\u8F7D
autoflush=true

# \u65E5\u671F\u683C\u5F0F
dateformat=yyyy-MM-dd HH:mm:ss

# \u662F\u5426\u8BB0\u5F55\u5E03\u5C14\u7C7B\u578B\u8FD4\u56DE\u503C\u7684\u7ED3\u679C\u96C6
#excludebinary=false

# \u5806\u6808\u8DDF\u8E2A\u8FC7\u6EE4
# \u8FC7\u6EE4\u5806\u6808\u8DDF\u8E2A\u4E2D\u5305\u542B\u8FD9\u4E9B\u5305\u540D\u7684\u884C
#stacktrace=false
#stacktraceclass=

# SQL \u91CD\u65B0\u52A0\u8F7D\u5C5E\u6027\u53D8\u5316
# reloadproperties=false
# reloadpropertiesinterval=60

# \u4F7F\u7528\u524D\u7F00\u6765\u8BC6\u522B P6Spy
#useprefix=false

# \u6267\u884C\u65F6\u95F4\u65E5\u5FD7\u8BB0\u5F55\uFF08\u53EA\u8BB0\u5F55\u8D85\u8FC7\u6307\u5B9A\u65F6\u95F4\u7684 SQL\uFF0C\u5355\u4F4D\uFF1A\u6BEB\u79D2\uFF09
# 0 \u8868\u793A\u8BB0\u5F55\u6240\u6709
executionThreshold=0

# ----------------------------------------------------------------
# \u6570\u636E\u5E93\u65B9\u8A00\u914D\u7F6E
# ----------------------------------------------------------------
# \u6570\u636E\u5E93\u65B9\u8A00\uFF0C\u7528\u4E8E\u683C\u5F0F\u5316 SQL
# \u53EF\u9009\u503C: 
#   - (\u7A7A): \u81EA\u52A8\u68C0\u6D4B
#   - com.p6spy.engine.spy.appender.MessageFormattingStrategy
#   - com.p6spy.engine.spy.appender.CustomLineFormat
#databaseDialectDateFormat=dd-MMM-yy
#databaseDialectTimestampFormat=dd-MMM-yy hh.mm.ss.fffffffff a
#databaseDialectBooleanFormat=boolean